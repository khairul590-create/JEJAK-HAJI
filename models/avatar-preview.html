<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar Jejak Haji</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dbe5df;color:#193f33;font:16px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:24px;left:24px;pointer-events:none}h1{margin:6px 0;font-size:28px}p{margin:6px 0;color:#4a6256}.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94vw;padding:14px 20px;background:#fffc;border:1px solid #fff;border-radius:18px}button,a{font:inherit;color:inherit;border:1px solid #9bad9e;border-radius:10px;background:#fff;padding:10px;text-decoration:none}#status{font-size:14px}</style></head>
<body><header><small>JEJAK HAJI · AVATAR 01</small><h1>Jemaah dalam 3D</h1><p>Seret untuk memusing. Cubit atau skrol untuk zum.</p><p id="status" role="status">Memuatkan avatar…</p></header><canvas id="view" aria-label="Pratonton avatar jemaah 3D"></canvas><div class="controls"><button id="spin" aria-pressed="true">Putaran: hidup</button><label><input id="shaved" type="checkbox"> Selepas bercukur</label><a href="../">Buka permainan</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{'use strict';const status=document.getElementById('status');try{
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#dbe5df');const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.05,40);camera.position.set(2.7,1.8,4.2);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,.95,0);controls.enableDamping=true;controls.minDistance=2.4;controls.maxDistance=7;controls.maxPolarAngle=Math.PI*.49;controls.autoRotate=true;controls.autoRotateSpeed=.65;
scene.add(new THREE.HemisphereLight(0xffffff,0x6e8976,1));const sun=new THREE.DirectionalLight(0xfff3df,2);sun.position.set(3,5,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;sun.shadow.bias=-.0005;scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0xc4d3c8,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);
let avatar;new THREE.GLTFLoader().load('jemaah-v1.glb',g=>{avatar=g.scene;avatar.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(avatar);status.textContent='Model Blender sebenar · versi kartun ringan';},undefined,()=>{status.textContent='Avatar tidak dapat dimuat. Cuba muat semula halaman.'});
document.getElementById('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent='Putaran: '+(controls.autoRotate?'hidup':'mati');e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate))};document.getElementById('shaved').onchange=e=>{const hair=avatar?.getObjectByName('Hair');if(hair)hair.visible=!e.target.checked};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
}catch(e){status.textContent='Pelayar ini tidak dapat memaparkan WebGL. Buka permainan dalam mod 2D.';console.error(e)}})();
</script></body></html>
