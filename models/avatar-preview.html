<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar Jejak Haji</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dbe5df;color:#193f33;font:16px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:24px;left:24px;pointer-events:none}h1{margin:6px 0;font-size:28px}p{margin:6px 0;color:#4a6256}.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94vw;padding:14px 20px;background:#fffc;border:1px solid #fff;border-radius:18px}button,a,select{min-height:44px;font:inherit;color:inherit;border:1px solid #9bad9e;border-radius:10px;background:#fff;padding:10px;text-decoration:none}#status{font-size:14px}</style></head>
<body><header><small>JEJAK HAJI · CHARACTER BERANGKA</small><h1>Jemaah dalam 3D</h1><p>Seret untuk memusing. Cubit atau skrol untuk zum.</p><p id="status" role="status">Memuatkan avatar…</p></header><canvas id="view" aria-label="Pratonton avatar jemaah 3D"></canvas><div class="controls"><select id="character" aria-label="Watak"><option value="lelaki-ihram">Lelaki · ihram</option><option value="perempuan-telekung">Perempuan · telekung</option><option value="lelaki-biasa">Lelaki · pakaian biasa</option><option value="perempuan-biasa">Perempuan · pakaian biasa</option></select><select id="animation" aria-label="Animasi"><option value="Idle">Berdiri</option><option value="Walk">Berjalan</option><option value="Takbir">Takbir</option><option value="Bersedekap">Bersedekap</option><option value="Rukuk">Rukuk</option><option value="Duduk">Duduk</option><option value="Sujud">Sujud</option><option value="Salam">Salam</option><option value="Groom">Bersihkan tangan</option><option value="Throw">Melontar</option><option value="Sleep">Baring</option></select><button id="spin" aria-pressed="true">Putaran: hidup</button><label><input id="shaved" type="checkbox"> Selepas bercukur</label><a href="../">Buka permainan</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{'use strict';const status=document.getElementById('status');try{
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#dbe5df');const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.05,40);camera.position.set(2.7,1.8,4.2);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,.95,0);controls.enableDamping=true;controls.minDistance=2.4;controls.maxDistance=7;controls.maxPolarAngle=Math.PI*.49;controls.autoRotate=true;controls.autoRotateSpeed=.65;
scene.add(new THREE.HemisphereLight(0xffffff,0x6e8976,1));const sun=new THREE.DirectionalLight(0xfff3df,2);sun.position.set(3,5,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;sun.shadow.bias=-.0005;scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0xc4d3c8,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);
let avatar,mixer,actions={},current='',request=0;
const clock=new THREE.Clock();
function appearance(){if(!avatar)return;avatar.traverse(o=>{if(o.name.startsWith('Hair_'))o.visible=!document.getElementById('shaved').checked;if(o.name.startsWith('Footwear_'))o.visible=!['Takbir','Bersedekap','Rukuk','Duduk','Sujud','Salam'].includes(current)})}
function animate(){const name=document.getElementById('animation').value;if(!actions[name])return;if(current&&actions[current])actions[current].fadeOut(.18);actions[name].reset().setEffectiveWeight(1).fadeIn(.18).play();current=name;appearance()}
function load(){const token=++request;status.textContent='Memuatkan character…';new THREE.GLTFLoader().load(document.getElementById('character').value+'.glb',g=>{
if(token!==request){dispose(g.scene);return}
if(avatar){scene.remove(avatar);mixer.stopAllAction();mixer.uncacheRoot(avatar);dispose(avatar)}
avatar=g.scene;mixer=new THREE.AnimationMixer(avatar);actions={};current='';for(const clip of g.animations)actions[clip.name]=mixer.clipAction(clip);
avatar.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});scene.add(avatar);animate();status.textContent='18 tulang · 11 animasi Blender · pilih gerakan di bawah';
},undefined,()=>{if(token===request)status.textContent='Character gagal dimuat. Cuba muat semula.'})}
function dispose(group){group.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose()}})}
document.getElementById('character').onchange=load;document.getElementById('animation').onchange=animate;load();
document.getElementById('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent='Putaran: '+(controls.autoRotate?'hidup':'mati');e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate))};document.getElementById('shaved').onchange=appearance;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);if(mixer)mixer.update(Math.min(clock.getDelta(),.1));controls.update();renderer.render(scene,camera)}frame();
}catch(e){status.textContent='Pelayar ini tidak dapat memaparkan WebGL. Buka permainan dalam mod 2D.';console.error(e)}})();
</script></body></html>
