# Jalankan skrip Blender di GitHub (bukan VPS). Hasil: artifact "blender-<skrip>"
# (GLB, .blend, render, log). Lancar: tab Actions → Blender → Run workflow,
# atau `gh workflow run blender.yml -f script=blender/build_avatar.py`.
name: Blender

on:
  workflow_dispatch:
    inputs:
      script:
        description: Skrip Blender (laluan dalam repo)
        default: blender/kaabah.py
      render:
        description: Hasilkan render pratonton (JH_RENDER=1)
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["blender/**"]

permissions:
  contents: read

concurrency:
  group: blender-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER: "4.5.15" # LTS; tukar di sini untuk naik versi

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}-linux-x64

      - name: Muat turun Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V="${BLENDER%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${V}/blender-${BLENDER}-linux-x64.tar.xz" -o b.tar.xz
          mkdir -p ~/blender && tar -xJf b.tar.xz -C ~/blender --strip-components=1 && rm b.tar.xz

      - name: Pustaka sistem untuk Blender tanpa paparan
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null

      - name: Jalankan skrip
        env:
          SCRIPT: ${{ inputs.script || 'blender/kaabah.py' }}
          JH_RENDER: ${{ (github.event_name == 'push' || inputs.render) && '1' || '0' }}
          JH_OUT: ${{ github.workspace }}/out
        run: |
          set -o pipefail
          case "$SCRIPT" in blender/*.py) ;; *) echo "Skrip mesti dalam blender/*.py"; exit 1;; esac
          test -f "$SCRIPT"
          mkdir -p "$JH_OUT"
          ~/blender/blender --version | sed -n 1p
          ~/blender/blender --background --factory-startup --python-exit-code 1 --python "$SCRIPT" 2>&1 | tee "$JH_OUT/blender.log"
          ls -la "$JH_OUT"

      - name: Nama artifact
        id: n
        env:
          SCRIPT: ${{ inputs.script || 'blender/kaabah.py' }}
        run: echo "name=blender-$(basename "$SCRIPT" .py)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.n.outputs.name }}
          path: out/
          retention-days: 14
