# Terbit manual game + pelayan Rombongan ke Cloudflare Workers.
# Perlu dua rahsia repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token API dengan templat "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  ID akaun Cloudflare
# Jika rahsia belum ditetapkan, aliran ini gagal dengan jelas; terbit manual menggunakan Wrangler OAuth masih boleh dilakukan.
# Lihat docs/ROMBONGAN.md.
name: Terbit ke Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  terbit:
    runs-on: ubuntu-latest
    steps:
      - name: Semak rahsia Cloudflare
        id: rahsia
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKAUN: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$AKAUN" ]; then
            echo "ada=1" >> "$GITHUB_OUTPUT"
          else
            echo "ada=0" >> "$GITHUB_OUTPUT"
            echo "::error::Rahsia CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum ditetapkan. Tiada deployment dilakukan (lihat docs/ROMBONGAN.md)."
            exit 1
          fi

      - name: Ambil kod main
        if: steps.rahsia.outputs.ada == '1'
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        if: steps.rahsia.outputs.ada == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bina game
        if: steps.rahsia.outputs.ada == '1'
        run: |
          npm install --no-audit --no-fund
          npx -y -p typescript@5.9.3 tsc -p tsconfig.json
          node build.mjs

      - name: Semak & sediakan pelayan
        if: steps.rahsia.outputs.ada == '1'
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json
          node siap.mjs

      - name: Terbit ke Cloudflare Workers
        if: steps.rahsia.outputs.ada == '1'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
